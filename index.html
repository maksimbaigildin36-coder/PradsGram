E.innerHTML=`<div class="scr" style="padding-bottom:30px"><div class="auth"><h1>Добро пожаловать в PradaGram!</h1><div class="note" style="font-size:16px;margin-top:0">Выберите способ регистрации ниже</div>
<div class="seg" id="mt"><button data-m="mail" class="on">По почте</button><button data-m="nomail">Без почты<small>(без восстановления пароля)</small></button></div>
<div class="note">Если вы выбрали зарегистрироваться без почты, то забыв пароль восстановить его будет невозможно, никто не имеет доступ к вашим паролям кроме вас.</div>
<div class="seg" id="md"><button data-d="in" class="on">Вход</button><button data-d="reg">Регистрация</button></div>
<input id="an" placeholder="NickName" autocomplete="username"><input id="am" type="email" placeholder="Почта"><input id="ap" type="password" placeholder="Пароль" autocomplete="current-password">
<div class="err" id="ae">${msg||''}</div><button class="btn" id="ab">Войти</button></div></div>`;
const upd=()=>{$('#am').style.display=meth=='mail'?'':'none';$('#ab').textContent=mode=='in'?'Войти':'Зарегистрироваться';$('#ae').textContent=''};upd();
$('#mt').onclick=e=>{const b=e.target.closest('button');if(!b)return;meth=b.dataset.m;[...$('#mt').children].forEach(x=>x.classList.toggle('on',x==b));upd()};
$('#md').onclick=e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.d;[...$('#md').children].forEach(x=>x.classList.toggle('on',x==b));upd()};
$('#ab').onclick=async()=>{const err=t=>$('#ae').textContent=t,nick=$('#an').value.trim(),mail=$('#am').value.trim().toLowerCase(),pw=$('#ap').value;
if(!nick||!pw||(meth=='mail'&&!mail))return err('Заполните все поля — пропускать нельзя');
const email=meth=='mail'?mail:await nmail(nick);
if(mode=='reg'){if(nick.length<3||nick.length>20)return err('NickName: от 3 до 20 символов');if(/\s/.test(nick))return err('NickName без пробелов');if(meth=='mail'&&!/^\S+@\S+\.\S+$/.test(mail))return err('Некорректная почта');if(pw.length<6)return err('Пароль: минимум 6 символов');
let cu;try{cu=(await au.createUserWithEmailAndPassword(email,pw)).user}catch(x){return err(ae(x,'Ошибка: '+(x.code||x.message)))}
const n={id:cu.uid,nick,nl:nick.toLowerCase(),hasMail:meth=='mail',about:'',avatar:'',stars:0,premium:false,banned:false,created:Date.now()};
try{const b=fs.batch();b.set(fs.doc('nicks/'+n.nl),{uid:cu.uid});b.set(fs.doc('users/'+cu.uid),n);await b.commit()}catch(x){console.error(x);await cu.delete().catch(()=>{});return err(x.code=='permission-denied'?'Этот NickName уже занят (или не опубликованы правила Firestore)':'Ошибка: '+(x.code||x.message))}
await attach(cu.uid);return start(C.users[cu.uid]||n)}
let cu;try{cu=(await au.signInWithEmailAndPassword(email,pw)).user}catch(x){return err(ae(x,'Неверный NickName, почта или пароль'))}
await attach(cu.uid);const u=C.users[cu.uid];
if(!u||u.nl!=nick.toLowerCase()){detach();await au.signOut();return err('Неверный NickName, почта или пароль')}
if(u.banned){detach();await au.signOut();return err('Аккаунт заблокирован. Зарегистрируйте или войдите в другой аккаунт.')}
start(u)}}
async function start(u){const sid=uid(),ss={id:sid,uid:u.id,dev:device(),t:Date.now()};C.sessions[sid]=ss;await fs.doc('sessions/'+sid).set(ss).catch(fer);await dbPut('meta',{k:'cur',uid:u.id,sid});S.u=u;S.sid=sid;S.tab='chats';home()}
async function logout(msg){const sid=S.sid;ready=false;S.pages.forEach(p=>p.close&&p.close());S.u=null;S.sid=null;S.spc=false;if(sid)await dbDel('sessions',sid).catch(()=>{});await dbDel('meta','cur');detach();await au.signOut().catch(()=>{});authView(msg)}
async function guard(){if(!S.u||!ready)return;const u=C.users[S.u.id],s=C.sessions[S.sid];if(!u||u.banned)return logout('Ваш аккаунт заблокирован. Вы можете войти в другой аккаунт.');if(!s)return logout('Сеанс завершён на другом устройстве');S.u=u}
// ---------- main shell ----------
function home(){E.innerHTML=`<div id="tc"></div><div id="sheet"><button data-c="channel">${ic('mega')}Создать канал</button><button data-c="chat">${ic('group')}Создать группу</button></div><button id="fab" aria-label="Создать">${ic('chatplus',30)}</button>
<nav><button data-t="chats">${ic('chat',28)}Чаты</button><button data-t="set">${ic('set',28)}Настройки</button><button data-t="prof">${ic('user',28)}Профиль</button></nav>`;
$('nav').onclick=e=>{const b=e.target.closest('button');b&&go(b.dataset.t)};
$('#fab').onclick=()=>{$('#fab').classList.toggle('o');$('#sheet').classList.toggle('o')};
$('#sheet').onclick=e=>{const b=e.target.closest('button');if(!b)return;$('#fab').classList.remove('o');$('#sheet').classList.remove('o');createFlow(b.dataset.c)};go(S.tab)}
function go(t){S.tab=t;$('#fab').style.display=t=='chats'?'':'none';$('#sheet').classList.remove('o');[...$('nav').children].forEach(b=>b.classList.toggle('on',b.dataset.t==t));({chats:chatsView,set:setView,prof:profView})[t]()}
async function chatsView(){const u=S.u,[cs,ms]=await Promise.all([dbAll('chats'),dbAll('messages')]),us=Object.fromEntries((await dbAll('users')).map(x=>[x.id,x]));
let rows=cs.filter(c=>c.members.includes(u.id)).map(c=>{const m=ms.filter(x=>x.cid==c.id).sort((a,b)=>a.t-b.t);return{c,last:m[m.length-1],n:Math.max(0,m.length-((c.seen||{})[u.id]||0))}}).sort((a,b)=>(b.last?b.last.t:b.c.created)-(a.last?a.last.t:a.c.created));
if(S.q)rows=rows.filter(r=>r.c.name.toLowerCase().includes(S.q.toLowerCase()));
if(S.tab!='chats')return;
$('#tc').innerHTML=`<div class="scr"><div class="top">${av(u,'sm',1)}<h1>PradaGram</h1><button class="ib" id="sb">${ic('search',28)}</button></div>${S.q!==null&&S.sOpen?`<input id="sq" placeholder="Поиск" value="${esc(S.q)}">`:''}
${rows.length?rows.map(r=>{const l=r.last,p=l?(r.c.type=='chat'?esc((us[l.uid]||{nick:'?'}).nick)+': ':'')+esc(l.text):'Нет сообщений';return`<div class="row" data-i="${r.c.id}">${av(r.c)}<div class="mid"><b>${esc(r.c.name)}</b><div class="s">${p}</div></div><div class="rt"><span>${l?ft(l.t):''}</span>${r.n?`<span class="bd">${r.n}</span>`:''}</div></div>`}).join(''):`<div class="empty">Пока нет чатов.<br>Нажмите на кнопку внизу справа, чтобы создать группу или канал.</div>`}</div>`;
$('#sb').onclick=()=>{S.sOpen=!S.sOpen;if(!S.sOpen)S.q='';chatsView().then(()=>$('#sq')&&$('#sq').focus())};
const q=$('#sq');if(q)q.oninput=()=>{S.q=q.value;const p=q.selectionStart;chatsView().then(()=>{const n=$('#sq');n.focus();n.setSelectionRange(p,p)})};
$('#tc').onclick=e=>{const r=e.target.closest('[data-i]');r&&openChat(r.dataset.i)}}
// ---------- create group / channel ----------
function createFlow(type){let img='';const ch=type=='channel';
const p=page(ch?'Новый канал':'Новая группа',`<div style="display:flex;gap:12px;align-items:center;margin-top:10px"><div class="av" id="ca" style="background:var(--c2);cursor:pointer">${ic('cam',28)}</div><input id="cn" maxlength="40" placeholder="${ch?'Название канала':'Название группы'}" style="margin:0"></div>
<input id="cd" maxlength="120" placeholder="Описание (необязательно)"><div class="note">Нажмите на круг слева, чтобы выбрать аватарку из галереи.</div><div class="err" id="ce"></div><button class="btn" id="cb">Создать ${ch?'канал':'группу'}</button>`);
$('#ca',p).onclick=()=>pick(d=>{img=d;$('#ca',p).style.cssText='background:url('+d+') center/cover;cursor:pointer';$('#ca',p).innerHTML=''});
$('#cb',p).onclick=async()=>{const n=$('#cn',p).value.trim();if(!n)return $('#ce',p).textContent='Введите название';const c={id:uid(),type,name:n,about:$('#cd',p).value.trim(),avatar:img,owner:S.u.id,members:[S.u.id],seen:{},created:Date.now()};await dbPut('chats',c);ping();p.close();chatsView();setTimeout(()=>openChat(c.id),250)}}
// ---------- chat view ----------
async function openChat(id){const c=await dbGet('chats',id);if(!c)return;const ch=c.type=='channel',mine=c.owner==S.u.id;
const p=document.createElement('div');p.className='pg';p.innerHTML=`<div class="pgt"><button class="ib" data-b>${ic('back',28)}</button>${av(c,'sm')}<div style="flex:1;min-width:0"><b style="font-size:19px;font-weight:500;display:block">${esc(c.name)}</b><span style="color:var(--m);font-size:14px" id="cm"></span></div></div><div class="msgs" id="ms"></div>${ch&&!mine?'<div class="ro">Публиковать может только владелец канала</div>':`<div class="comp">${av(S.u,'sm',1)}<input id="ci" placeholder="${ch?'Публикация':'Сообщение'}" autocomplete="off"><button class="send" id="cs">${ic('send',24)}</button></div>`}`;E.append(p);
S.open=id;const rend=async()=>{const [cc,all,us]=[await dbGet('chats',id),await dbAll('messages'),Object.fromEntries((await dbAll('users')).map(x=>[x.id,x]))];if(!cc)return;const m=all.filter(x=>x.cid==id).sort((a,b)=>a.t-b.t);
for(const x of m)if(ch&&!(x.v||[]).includes(S.u.id)){x.v=[...(x.v||[]),S.u.id];dbPut('messages',x)}
cc.seen=cc.seen||{};if(cc.seen[S.u.id]!=m.length){cc.seen[S.u.id]=m.length;await dbPut('chats',cc)}
$('#cm',p).textContent=cc.members.length+(ch?' подписчиков':' участников');const box=$('#ms',p),bot=box.scrollHeight-box.scrollTop-box.clientHeight<80;
box.innerHTML=m.length?m.map(x=>{const u=us[x.uid]||{nick:'Удалён'};
if(ch)return`<div class="post"><div class="n">${esc(cc.name)}</div>${esc(x.text)}<div class="f">${ic('eye',15)}${(x.v||[]).length}<span>${esc(u.nick)}, ${ft(x.t)}</span></div></div>`;
const me=x.uid==S.u.id;return`<div class="m ${me?'me':''}">${me?'':`<div data-u="${u.id}" style="cursor:pointer">${av(u,'sm')}</div>`}<div class="bub">${me?'':`<div class="n" data-u="${u.id}" style="color:${col(u.nick)}">${esc(u.nick)}</div>`}${esc(x.text)}<span class="tm">${ft(x.t)}</span></div></div>`}).join(''):`<div class="empty">${ch?'В канале пока нет публикаций':'Сообщений пока нет. Напишите первым'}</div>`;
if(bot||!box.dataset.k){box.scrollTop=box.scrollHeight;box.dataset.k=1}};
$('#ms',p).onclick=async e=>{const t=e.target.closest('[data-u]');if(!t)return;const u=await dbGet('users',t.dataset.u);if(u)modal(`<div style="text-align:center">${av(u,'big')}<h3 style="margin-top:12px">${esc(u.nick)}</h3><div class="note" style="font-size:16px">${u.about?esc(u.about):'Пользователь ничего не рассказал о себе'}</div></div>`)};
const send=async()=>{const i=$('#ci',p),t=i.value.trim();if(!t)return;i.value='';await dbPut('messages',{id:uid(),cid:id,uid:S.u.id,text:t,t:Date.now(),v:[S.u.id]});ping();await rend()};
if($('#cs',p)){$('#cs',p).onclick=send;$('#ci',p).onkeydown=e=>{if(e.key=='Enter')send()}}
p.onclose=()=>{S.open=null;chatsView()};p.rend=rend;S.pages.push(p);
p.close=()=>{p.onclose();p.classList.add('out');setTimeout(()=>p.remove(),220)};$('[data-b]',p).onclick=p.close;await rend()}
bc.onmessage=()=>{const p=[...document.querySelectorAll('.pg')].pop();if(S.open&&p&&p.rend)p.rend();else if(S.u&&S.tab=='chats'&&!document.querySelector('.pg'))chatsView();guard()};
setInterval(guard,6000);
// ---------- settings ----------
const row=(i,g,t,s,id)=>`<div class="row" data-r="${id}"><div class="tile" style="background:${g}">${ic(i,26)}</div><div class="mid"><b>${t}</b>${s?`<div class="s">${s}</div>`:''}</div></div>`;
function setView(){const u=S.u;$('#tc').innerHTML=`<div class="scr"><div class="top"><h1>Настройки</h1></div>
<div class="ph">${av(u,'big',1)}<b>${esc(u.nick)}</b><span>@${esc(u.nick)}${u.mail?' • '+esc(u.mail):''}</span></div>
<div class="card">${row('dev','linear-gradient(135deg,#2cc4d8,#1c93b5)','Устройства','Управление активными сеансами','dev')}${row('bat','linear-gradient(135deg,#f28a2e,#d9601a)','Энергосбережение',S.eco?'Включено — меньше анимаций':'Экономия энергии при низком заряде','eco')}${row('globe','linear-gradient(135deg,#a259e6,#7c3ad0)','Язык','Русский','lang')}</div>
<div class="card">${row('star','linear-gradient(135deg,#7a6bff,#b05cf0)','PradaGram Premium','','prem')}${row('star','linear-gradient(135deg,#ffb52e,#f0820f)','Звёзды PradaGram','','stars')}${row('lock','linear-gradient(135deg,#e5534b,#b52e3a)','SPC PANEL','','spc')}${row('gift','linear-gradient(135deg,#f28a2e,#e0561a)','Отправить подарок','','gift')}</div>
<div class="card"><div class="lbl">Помощь</div>${row('bulb','linear-gradient(135deg,#a259e6,#6d4be0)','Возможности PradaGram','','feat')}${row('shield','linear-gradient(135deg,#3ec46d,#259a4c)','Политика конфиденциальности','','priv')}</div>
<div class="note" style="text-align:center">PradaGram v0.1 · web</div></div>`;
$('#tc').onclick=e=>{const r=e.target.closest('[data-r]');r&&({dev:devices,eco:toggleEco,lang:lang,prem:premium,stars:stars,spc:spcGate,gift:()=>info('Отправить подарок','Раздел появится в следующем обновлении.'),feat:feat,priv:()=>info('Политика конфиденциальности','Пароли хранятся только в виде криптографического хэша. Мы не передаём ваши данные третьим лицам. Если вы зарегистрировались без почты, восстановить пароль невозможно.')})[r.dataset.r]()}}
function info(t,b){page(t,`<div class="note" style="font-size:17px;color:#cfd8e3">${b}</div>`)}
function feat(){info('Возможности PradaGram','Группы и каналы с аватарками.<br>Счётчик непрочитанных сообщений.<br>Время последнего сообщения в списке чатов.<br>Профиль с описанием «О себе».<br>Звёзды и Premium.<br>Управление активными сеансами.')}
async function toggleEco(){S.eco=!S.eco;await dbPut('meta',{k:'eco',v:S.eco});setView();toast(S.eco?'Энергосбережение включено':'Энергосбережение выключено')}
function lang(){const m=modal(`<h3>Язык</h3><div class="row" style="justify-content:space-between">Русский ${ic('check',22,'')}</div><div class="row" style="color:var(--m)">English — скоро</div>`)}
async function devices(){const p=page('Устройства','<div id="dl"></div>');const r=async()=>{const ss=(await dbAll('sessions')).filter(s=>s.uid==S.u.id).sort((a,b)=>b.t-a.t);$('#dl',p).innerHTML=ss.map(s=>`<div class="dv"><b style="font-weight:500">${esc(s.dev)}</b> ${s.id==S.sid?'<span class="chip">Это устройство</span>':''}<br><small>Вход: ${new Date(s.t).toLocaleString('ru')}</small>${s.id!=S.sid?`<br><button class="btn g" style="margin-top:8px;padding:10px" data-k="${s.id}">Завершить сеанс</button>`:''}</div>`).join('')};await r();$('#dl',p).onclick=async e=>{const b=e.target.closest('[data-k]');if(b){await dbDel('sessions',b.dataset.k);ping();r()}}}
function stars(){const p=page('Звёзды PradaGram',`<div class="frame"><h3>Звёзды PradaGram</h3><div class="sc"><span>${S.u.stars.toLocaleString('ru')}</span>${starSvg(64)}</div></div>`);rain(p,'star')}
function premium(){const a=S.u.premium,p=page('PradaGram Premium',`<div class="frame p"><h3>PREMIUM MODE</h3><div style="margin-top:18px;font-size:20px;font-weight:500;color:${a?'#6dffa1':'#ff9a94'}">Подписка ${a?'активна':'неактивна'}</div></div>`);rain(p,'usd')}
// ---------- profile ----------
function profView(){const u=S.u;$('#tc').innerHTML=`<div class="scr"><div class="top"><h1>Профиль</h1></div>
<div style="display:flex;gap:16px;align-items:center;padding:6px"><div id="pa" style="cursor:pointer">${av(u,'big',1)}</div><div style="display:flex;align-items:center;gap:6px;min-width:0"><b style="font-size:26px;font-weight:500;word-break:break-all">${esc(u.nick)}</b><button class="ib" id="pn">${ic('pen',22)}</button></div></div>
<div class="card" style="padding:10px 14px"><div class="lbl" style="padding-left:0">О себе</div><div class="fld ${u.about?'':'e'}" id="pb" style="padding-left:0">${u.about?esc(u.about):'Нажмите, чтобы добавить описание'}</div></div>
<div class="card" style="padding:14px 18px;display:flex;align-items:center;justify-content:space-between"><span>Звёзды</span><span style="display:flex;gap:8px;align-items:center;font-weight:500">${u.stars.toLocaleString('ru')}${starSvg(26)}</span></div>
<button class="btn g" id="lo" style="display:flex;gap:8px;justify-content:center">${ic('out',22)}Выйти из аккаунта</button></div>`;
$('#pa').onclick=()=>pick(async d=>{u.avatar=d;await saveU(u);profView()});
$('#pb').onclick=()=>{const m=modal(`<h3>О себе</h3><textarea id="ab2" rows="4" maxlength="200">${esc(u.about)}</textarea><button class="btn" id="sv">Сохранить</button>`);$('#sv',m).onclick=async()=>{u.about=$('#ab2',m).value.trim();await saveU(u);m.remove();profView()}};
$('#pn').onclick=()=>{const m=modal(`<h3>Изменить NickName</h3><input id="nn" maxlength="20" value="${esc(u.nick)}"><div class="err" id="ne"></div><button class="btn" id="sv">Сохранить</button>`);$('#sv',m).onclick=async()=>{const n=$('#nn',m).value.trim(),e=t=>$('#ne',m).textContent=t;if(n.length<3||/\s/.test(n))return e('От 3 до 20 символов, без пробелов');if((await dbAll('users')).some(x=>x.nl==n.toLowerCase()&&x.id!=u.id))return e('Этот NickName уже занят');const on=u.nick,ol=u.nl;u.nick=n;u.nl=n.toLowerCase();if(ol!=u.nl){try{const b=fs.batch();b.set(fs.doc('nicks/'+u.nl),{uid:u.id});b.delete(fs.doc('nicks/'+ol));b.set(fs.doc('users/'+u.id),u);await b.commit()}catch(x){u.nick=on;u.nl=ol;return e('NickName занят или ошибка: '+(x.code||''))}}else await saveU(u);m.remove();profView()}};

// ---------- SPC PANEL ----------
// запись админа: ждём подтверждения сервера (раньше успех показывался, хотя Firestore отклонял запись)
async function adminPatch(id,patch){try{await fs.doc('users/'+id).update(patch);return null}catch(x){console.error(x);return x.code=='permission-denied'?'Сервер отклонил запись: у вашего аккаунта нет прав админа. В консоли Firebase создайте документ admins/'+S.u.id+' (коллекция admins).':'Ошибка: '+(x.code||x.message)}}
let bad=0,lockT=0;
function spcGate(){if(S.spc)return spcPanel();const m=modal(`<h3>SPC PANEL</h3><div class="note" style="margin-top:0">Введите секретный код доступа</div><input id="sk" type="password" placeholder="Код доступа"><div class="err" id="se"></div><button class="btn" id="so">Войти</button>`);
$('#so',m).onclick=async()=>{const e=t=>$('#se',m).textContent=t;if(Date.now()<lockT)return e('Слишком много попыток. Подождите немного.');const c=$('#sk',m).value;if(!c)return e('Введите код');
if(await hx(c,'pg-spc-v1',2e5)==SPC_HASH){bad=0;S.spc=true;m.remove();spcPanel()}else{if(++bad>=5){lockT=Date.now()+30000;bad=0}e('Неверный код')}}}
function spcPanel(){const p=page('SPC PANEL',`<div class="card" style="padding:14px"><button class="btn" data-f="give">Выдача звёзд по NickName</button><button class="btn r" data-f="ban">Заблокировать аккаунт по NickName</button><button class="btn g" data-f="unban">Разблокировать аккаунт по NickName</button><button class="btn" style="background:#b8791a" data-f="self">Выдача звёзд себе</button></div>`);p.onclick=e=>{const b=e.target.closest('[data-f]');b&&flow(b.dataset.f)}}
function flow(k){const T={give:'Выдача звёзд по NickName',ban:'Заблокировать аккаунт',unban:'Разблокировать аккаунт',self:'Выдача звёзд себе'};const m=modal(`<h3>${T[k]}</h3><div id="fb"></div>`),b=$('#fb',m);let tg=null;
const s3=()=>{b.innerHTML=`<div class="note" style="margin-top:0">Игрок: <b>${esc(tg.nick)}</b> (${tg.banned?'заблокирован':'активен'})</div><div class="err" id="fe"></div><button class="btn ${k=='ban'?'r':''}" id="fo">Подтвердить</button>`;$('#fo',m).onclick=async()=>{const e=t=>$('#fe',m).textContent=t,bt=$('#fo',m);if(bt.disabled)return;
const d=await fs.doc('users/'+tg.id).get().catch(()=>null);if(!d||!d.exists)return e('Игрок не найден или нет сети');const cur=d.data();
if(k=='ban'){if(tg.id==S.u.id)return e('Нельзя заблокировать самого себя');if(cur.banned)return e('Аккаунт уже заблокирован')}else if(!cur.banned)return e('Аккаунт не заблокирован');
bt.disabled=true;const er=await adminPatch(tg.id,{banned:k=='ban'});bt.disabled=false;if(er)return e(er);
toast('Аккаунт '+tg.nick+(k=='ban'?' заблокирован':' разблокирован'));m.remove()}};
const s2=()=>{b.innerHTML=`<div class="note" style="margin-top:0">Получатель: <b>${esc(tg.nick)}</b></div><input id="fa" type="number" min="1" max="2500000" placeholder="Количество звёзд (макс. 2 500 000)"><div class="err" id="fe"></div><button class="btn" id="fo">Выдать</button>`;$('#fo',m).onclick=async()=>{const bt=$('#fo',m),e=t=>$('#fe',m).textContent=t;if(bt.disabled)return;const n=Number($('#fa',m).value);if(!Number.isInteger(n)||n<1)return e('Введите целое число больше 0');if(n>2500000)return e('Максимум — 2 500 000');
bt.disabled=true;const er=await adminPatch(tg.id,{stars:firebase.firestore.FieldValue.increment(n)});bt.disabled=false;if(er)return e(er);
if(C.users[S.u.id])S.u=C.users[S.u.id];toast(`Выдано ${n.toLocaleString('ru')} звёзд — ${tg.nick}`);m.remove();if(S.tab!='chats')go(S.tab)}};
if(k=='self'){tg=S.u;return s2()}
b.innerHTML=`<input id="fn" placeholder="NickName игрока"><div class="err" id="fe"></div><button class="btn" id="fo">Проверить</button>`;
$('#fo',m).onclick=async()=>{const n=$('#fn',m).value.trim().toLowerCase();if(!n)return $('#fe',m).textContent='Введите NickName';tg=(await dbAll('users')).find(x=>x.nl==n);if(!tg)return $('#fe',m).textContent='Игрок с таким NickName не найден';k=='give'?s2():s3()}}
// ---------- boot ----------
(async()=>{await open();const e=await dbGet('meta','eco');S.eco=!!(e&&e.v);let first=true;
au.onAuthStateChanged(async cu=>{if(!first)return;first=false;if(!cu)return authView();
await attach(cu.uid);const u=C.users[cu.uid],c=await dbGet('meta','cur');
if(u&&c&&c.uid==cu.uid&&C.sessions[c.sid]&&!u.banned){S.u=u;S.sid=c.sid;return home()}
const msg=u&&u.banned?'Ваш аккаунт заблокирован. Вы можете войти в другой аккаунт.':(c?'Сеанс завершён на другом устройстве':'');
detach();await dbDel('meta','cur');await au.signOut();authView(msg)})})();
</script></body></html>
